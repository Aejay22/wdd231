<svg xmlns="http://www.w3.org/2000/svg" viewBox="14 14 456 120" width="228" height="60" role="img" aria-labelledby="logoTitle" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="logoTitle">Chamber of Commerce</title>

  <!-- Emblem: a classic building with columns -->
  <g transform="translate(20 20)">
    <circle cx="60" cy="60" r="58" fill="#12355b"/>
    <!-- roof -->
    <polygon points="60,22 98,44 22,44" fill="#f2b632"/>
    <!-- columns -->
    <rect x="30" y="50" width="10" height="34" fill="#ffffff"/>
    <rect x="48" y="50" width="10" height="34" fill="#ffffff"/>
    <rect x="66" y="50" width="10" height="34" fill="#ffffff"/>
    <rect x="84" y="50" width="10" height="34" fill="#ffffff" transform="translate(-10 0)"/>
    <!-- base steps -->
    <rect x="24" y="86" width="72" height="6" fill="#f2b632"/>
    <rect x="18" y="94" width="84" height="6" fill="#f2b632"/>
  </g>

  <!-- Text -->
  <text x="160" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#12355b">Chamber</text>
  <text x="160" y="112" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700" fill="#12355b">of Commerce</text>
  <rect x="160" y="124" width="300" height="4" fill="#f2b632"/>
</svg>
