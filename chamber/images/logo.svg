<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" width="420" height="120" role="img" aria-labelledby="title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="title">Timbuktu Chamber of Commerce</title>

  <!-- Round badge -->
  <circle cx="60" cy="60" r="52" fill="#14532d"/>
  <circle cx="60" cy="60" r="46" fill="none" stroke="#f5b82e" stroke-width="2"/>

  <!-- Building roof (triangle) -->
  <polygon points="60,26 92,46 28,46" fill="#f5b82e"/>

  <!-- Columns -->
  <rect x="34" y="50" width="8" height="30" fill="#ffffff"/>
  <rect x="49" y="50" width="8" height="30" fill="#ffffff"/>
  <rect x="64" y="50" width="8" height="30" fill="#ffffff"/>
  <rect x="79" y="50" width="8" height="30" fill="#ffffff"/>

  <!-- Base -->
  <rect x="28" y="82" width="64" height="7" fill="#f5b82e"/>

  <!-- Text -->
  <text x="130" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="bold" fill="#14532d">Timbuktu</text>
  <text x="132" y="86" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3" fill="#b8860b">CHAMBER OF COMMERCE</text>
</svg>
